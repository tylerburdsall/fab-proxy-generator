name: Update card data

# Pulls the latest cards from the-fab-cube/flesh-and-blood-cards, rebuilds the
# slim data/cards.min.json, and commits it if anything changed. The commit
# triggers the "Deploy to Pages" workflow.

# Manual-only: runs when you click "Run workflow" in the Actions tab.
# workflow_dispatch requires write access to the repo, so only you (and any
# collaborators you add) can trigger it — not the public.
on:
  workflow_dispatch: {}

# `contents: write` to push the branch, `pull-requests: write` to open the PR.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-cards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v5

      - name: Checkout source card database (English JSON only)
        uses: actions/checkout@v5
        with:
          repository: the-fab-cube/flesh-and-blood-cards
          path: source
          sparse-checkout: |
            json/english
          sparse-checkout-cone-mode: true

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      # --update-banner rewrites the announcement banner in index.html to name
      # the newly added sets. It also exports `new_sets` / `new_cards` outputs.
      - name: Build slim card data
        id: build
        run: node scripts/build-data.mjs source data/cards.min.json --update-banner

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet -- data/cards.min.json index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No card data changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # `main` is protected (changes must go through a pull request), so we
      # push the update to a branch and open a PR instead of pushing directly.
      - name: Create pull request
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y-%m-%d)"
          BRANCH="chore/update-card-data-${DATE}"
          NEW_SETS="${{ steps.build.outputs.new_sets }}"
          SUBJECT="chore: update card data from the-fab-cube (${DATE})"
          if [ -n "$NEW_SETS" ]; then
            SUBJECT="chore: add ${NEW_SETS} card data (${DATE})"
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Reuse today's branch if a previous run already created it.
          git checkout -B "$BRANCH"
          git add data/cards.min.json index.html
          git commit -m "$SUBJECT"
          git push --force-with-lease origin "$BRANCH"

          # Open a PR only if one isn't already open for this branch.
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$SUBJECT" \
              --body "Automated update of \`data/cards.min.json\` from [the-fab-cube/flesh-and-blood-cards](https://github.com/the-fab-cube/flesh-and-blood-cards).${NEW_SETS:+ New sets: **${NEW_SETS}**.} The announcement banner in \`index.html\` has been updated to match. Generated by the \`Update card data\` workflow — merging this will trigger a Pages deploy."
          else
            echo "A pull request for $BRANCH is already open; pushed the latest data to it."
          fi
