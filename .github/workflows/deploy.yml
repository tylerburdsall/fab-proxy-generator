name: Deploy to Pages

# Publishes the static site to GitHub Pages on every push to main (including the
# automated card-data commits) and on manual dispatch.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # Publish the repo root (static site). Exclude source/build tooling.
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
